{% extends 'base.html' %}

{% block title %}Log In — Cloud File Share{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass-panel animate-fade-in">
        <div class="auth-header">
            <div class="auth-icon-wrap">
                <i data-lucide="lock" class="auth-icon"></i>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to manage and share your cloud files</p>
        </div>

        <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}" class="auth-form" id="loginForm">
            <div class="form-group">
                <label for="identifier" class="form-label">Username or Email</label>
                <div class="input-with-icon">
                    <i data-lucide="user" class="input-icon"></i>
                    <input type="text" id="identifier" name="identifier" class="form-control" 
                           placeholder="e.g. clouduser or user@example.com" value="{{ identifier|default('') }}" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-with-icon">
                    <i data-lucide="key" class="input-icon"></i>
                    <input type="password" id="password" name="password" class="form-control" 
                           placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginSubmitBtn">
                <i data-lucide="log-in"></i>
                <span>Sign In</span>
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('register') }}" class="auth-link">Create Account</a></p>
            <div class="auth-lab-hint">
                <i data-lucide="shield-check"></i>
                <span>Secure password hashing enabled with pbkdf2:sha256</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
